# HomeManager の周辺ミドルウェア（本番: Raspberry Pi / ミニ PC）
# アプリ本体は systemd で動かす（homemanager.service）。DB は SQLite でアプリの中にあるので、ここには無い
# MQTT の機器（Zigbee2MQTT・Tasmota など）をつなぐときだけ使う
#
# 使い方:
#   docker compose up -d   # Podman なら podman compose up -d

services:
  mosquitto:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    ports:
      # P2 で LAN の機器（Zigbee2MQTT・Tasmota など）をつなぐときに、認証を設定してから公開する
      - "127.0.0.1:1883:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data
      - mosquitto-log:/mosquitto/log

  # Zigbee の機器をつなぐときだけ有効にする（USB ドングルのデバイス名は環境に合わせる）
  # zigbee2mqtt:
  #   image: koenkk/zigbee2mqtt:2
  #   restart: unless-stopped
  #   depends_on:
  #     - mosquitto
  #   ports:
  #     - "8081:8080"
