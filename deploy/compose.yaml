# HomeManager の周辺ミドルウェア（本番: Raspberry Pi / ミニ PC）
# アプリ本体は systemd で動かす（homemanager.service）。ここではミドルウェアだけを動かす
#
# 使い方:
#   cp .env.example .env   # パスワードを書き換える
#   docker compose up -d   # Podman なら podman compose up -d

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: homemanager
      POSTGRES_USER: homemanager
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?.env に POSTGRES_PASSWORD を設定する}
      TZ: Asia/Tokyo
    ports:
      # アプリは同じ機械で動くので、外には公開しない
      - "127.0.0.1:5432:5432"
    volumes:
      # PostgreSQL 18 のイメージはデータを /var/lib/postgresql 以下に置く
      - postgres-data:/var/lib/postgresql

  mosquitto:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    ports:
      # P2 で LAN の機器（Zigbee2MQTT・Tasmota など）をつなぐときに、認証を設定してから公開する
      - "127.0.0.1:1883:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data
      - mosquitto-log:/mosquitto/log

  # Zigbee の機器をつなぐときだけ有効にする（USB ドングルのデバイス名は環境に合わせる）
  # zigbee2mqtt:
  #   image: koenkk/zigbee2mqtt:2
  #   restart: unless-stopped
  #   depends_on:
  #     - mosquitto
  #   ports:
  #     - "8081:8080"
  #   volumes:
  #     - zigbee2mqtt-data:/app/data
  #     - /run/udev:/run/udev:ro
  #   devices:
  #     - /dev/ttyUSB0:/dev/ttyACM0
  #   environment:
  #     TZ: Asia/Tokyo

volumes:
  postgres-data:
  mosquitto-data:
  mosquitto-log:
  # zigbee2mqtt-data:
